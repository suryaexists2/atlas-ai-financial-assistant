[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-ai-assistant"
version = "0.1.0"
description = "Atlas — AI Financial Assistant inside Telegram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.16",
    "structlog>=25.2",
    "httpx>=0.28",
    "aiogram>=3.19",
    "python-dotenv>=1.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "ASYNC"]
ignore = ["B008", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ingestion.py" = ["E501"]  # hand-built PDF/xlsx fixtures keep raw bytes inline